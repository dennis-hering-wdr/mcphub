services:
  mcphub:
    image: samanhappy/mcphub:1.1.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCPHUB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      USE_DB: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - mcphub-data:/app/data

volumes:
  mcphub-data:
